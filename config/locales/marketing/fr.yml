    faq:
      title: Questions fréquentes
      items:
      - q: Dans quelle langue l'imam doit-il parler ?
        a: Bosnien, croate, serbe, albanais, turc, arabe, allemand, anglais, français ou néerlandais. Vous choisissez la langue à l'inscription et pouvez la changer à tout moment.
      - q: Les fidèles ont-ils besoin d'une application ?
        a: Non. Ils scannent le QR code et lisent dans le navigateur. Cela fonctionne sur tous les smartphones.
      - q: De quoi avons-nous besoin à la mosquée ?
        a: Un téléphone, une tablette ou un ordinateur connecté à internet près de l'imam. Un micro-cravate améliore la qualité, mais n'est pas obligatoire.
      - q: Peut-on afficher la traduction sur une télévision ?
        a: Oui. Ouvrez votre-mosquee.hutba.app/tv sur une smart TV, via Chromecast ou sur un ordinateur relié en HDMI. Le texte est assez grand pour toute la salle, et un QR code invite à suivre sur le téléphone.
      - q: La traduction est-elle précise ?
        a: La traduction est très compréhensible, mais automatique. Les versets du Coran et les termes courants sont généralement bien reconnus ; des erreurs ponctuelles sont possibles.
      - q: Que se passe-t-il après 60 jours ?
        a: Vous recevez un rappel à temps. Si vous payez, tout continue. Sinon, la diffusion est mise en pause – rien de plus.
