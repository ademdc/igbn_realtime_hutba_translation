    faq:
      title: Veelgestelde vragen
      items:
      - q: In welke taal moet de imam spreken?
        a: Bosnisch, Kroatisch, Servisch, Albanees, Turks, Arabisch, Urdu, Duits, Engels, Frans of Nederlands. U kiest de taal bij het aanmelden en kunt die altijd wijzigen.
      - q: Hebben luisteraars een app nodig?
        a: Nee. Ze scannen de QR-code en lezen mee in de browser. Het werkt op elke smartphone.
      - q: Wat hebben we nodig in de moskee?
        a: Een telefoon, tablet of laptop met internet in de buurt van de imam. Een dasspeldmicrofoon verbetert de kwaliteit, maar is niet verplicht.
      - q: Kunnen we de vertaling op een tv tonen?
        a: Ja. Open uw-moskee.hutba.app/tv op een smart-tv, via Chromecast of op een laptop met HDMI. De tekst is groot genoeg voor de hele zaal, en een QR-code nodigt uit om mee te lezen op de telefoon.
      - q: Hoe nauwkeurig is de vertaling?
        a: De vertaling is goed te volgen, maar wel automatisch. Koranverzen en vaste begrippen worden meestal goed herkend; af en toe gaat er iets mis.
      - q: Kunnen we ons eigen domein gebruiken?
        a: Ja, voor € 5 per maand. Luisteraars openen dan bijv. hutba.uw-moskee.nl in plaats van uw-moskee.hutba.app. U boekt het domein onder Betaling, voegt een CNAME-record toe bij uw domeinprovider en wij regelen het beveiligingscertificaat.
      - q: Wat gebeurt er na 30 dagen?
        a: 'U krijgt op tijd een herinnering. Betaalt u, dan loopt alles door. Betaalt u niet, dan gaat uw moskee over op het gratis abonnement: 80 minuten uitzenden per maand in één taal.'
