    faq:
      title: Frequently asked questions
      items:
      - q: Which language does the imam have to speak?
        a: Bosnian, Croatian, Serbian, Albanian, Turkish, Arabic, Urdu, German, English, French or Dutch. You choose the language when you sign up and can change it at any time.
      - q: Do listeners need an app?
        a: No. They scan the QR code and read along in the browser. It works on any smartphone.
      - q: What do we need in the mosque?
        a: A phone, tablet or laptop with internet near the imam. A clip-on microphone improves quality but is not required.
      - q: Can we show the translation on a TV?
        a: Yes. Open your-dzemat.hutba.app/tv on a smart TV, through Chromecast or on a laptop connected over HDMI. The text is large enough for the whole hall, and a QR code invites people to read along on their phones.
      - q: How accurate is the translation?
        a: The translation is very readable, but it is machine translation. Qur'anic verses and fixed terms are usually recognised correctly; occasional mistakes happen.
      - q: Can we use our own domain?
        a: Yes, for €5 per month. Listeners then open e.g. hutba.your-mosque.com instead of your-dzemat.hutba.app. You book the domain under Billing, add a CNAME record at your domain provider, and we take care of the security certificate.
      - q: What happens after 30 days?
        a: 'You get a reminder in good time. If you pay, everything continues. If you don''t, your mosque moves to the free plan: 60 minutes of broadcasting a month in one language.'
