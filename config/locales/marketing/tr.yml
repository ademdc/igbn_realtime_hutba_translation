    faq:
      title: Sık sorulan sorular
      items:
      - q: İmam hangi dilde konuşmalı?
        a: Boşnakça, Hırvatça, Sırpça, Arnavutça, Türkçe, Arapça, Urduca, Almanca, İngilizce, Fransızca veya Felemenkçe. Dili kayıt olurken seçersiniz ve istediğiniz zaman değiştirebilirsiniz.
      - q: Dinleyicilerin uygulamaya ihtiyacı var mı?
        a: Hayır. QR kodu tarar ve tarayıcıda okurlar. Her akıllı telefonda çalışır.
      - q: Camide neye ihtiyacımız var?
        a: İmamın yakınında internete bağlı bir telefon, tablet veya dizüstü bilgisayar. Yaka mikrofonu kaliteyi artırır ama zorunlu değildir.
      - q: Tercümeyi televizyonda gösterebilir miyiz?
        a: Evet. camiiniz.hutba.app/tv adresini akıllı TV'de, Chromecast ile veya HDMI ile bağlı bir dizüstü bilgisayarda açın. Yazı tüm salon için yeterince büyüktür ve bir QR kodu telefondan takip etmeye davet eder.
      - q: Tercüme ne kadar doğru?
        a: Tercüme oldukça anlaşılırdır ama makine tercümesidir. Ayetler ve kalıp ifadeler genellikle doğru tanınır; ara sıra hatalar olabilir.
      - q: Kendi alan adımızı kullanabilir miyiz?
        a: Evet, aylık 5 € karşılığında. Dinleyiciler o zaman camiiniz.hutba.app yerine ör. hutba.camiiniz.com adresini açar. Alan adını Ödeme bölümünden alırsınız, sağlayıcınızda bir CNAME kaydı eklersiniz, güvenlik sertifikasıyla biz ilgileniriz.
      - q: 30 günden sonra ne olur?
        a: 'Zamanında bir hatırlatma alırsınız. Öderseniz her şey devam eder. Ödemezseniz caminiz ücretsiz pakete geçer: tek dilde ayda 60 dakika yayın.'
