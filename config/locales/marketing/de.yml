    faq:
      title: Häufige Fragen
      items:
      - q: In welcher Sprache muss der Imam sprechen?
        a: Bosnisch, Kroatisch, Serbisch, Albanisch, Türkisch, Arabisch, Deutsch, Englisch, Französisch oder Niederländisch. Sie wählen die Sprache bei der Anmeldung und können sie jederzeit ändern.
      - q: Brauchen die Zuhörer eine App?
        a: Nein. Sie scannen den QR-Code und lesen im Browser mit. Das funktioniert auf jedem Smartphone.
      - q: Was brauchen wir in der Moschee?
        a: Ein Handy, Tablet oder Laptop mit Internet in der Nähe des Imams. Ein Ansteckmikrofon verbessert die Qualität, ist aber kein Muss.
      - q: Können wir die Übersetzung auf einem Fernseher zeigen?
        a: Ja. Öffnen Sie ihr-dzemat.hutba.app/tv auf einem Smart-TV, über Chromecast oder an einem Laptop mit HDMI. Die Schrift ist groß genug für den ganzen Raum, und ein QR-Code lädt zum Mitlesen auf dem Handy ein.
      - q: Wie genau ist die Übersetzung?
        a: Die Übersetzung ist sehr gut verständlich, aber maschinell. Koranverse und feste Begriffe werden meist korrekt erkannt; einzelne Fehler kommen vor.
      - q: Können wir unsere eigene Domain verwenden?
        a: Ja, für 5 € pro Monat. Statt ihr-dzemat.hutba.app öffnen Zuhörer dann z. B. hutba.ihre-moschee.de. Sie buchen die Domain in der Abrechnung, legen bei Ihrem Domain-Anbieter einen CNAME-Eintrag an, und wir kümmern uns um das Sicherheitszertifikat.
      - q: Was passiert nach den 60 Tagen?
        a: Sie erhalten rechtzeitig eine Erinnerung. Zahlen Sie, läuft alles weiter. Zahlen Sie nicht, wird die Übertragung pausiert – sonst passiert nichts.
