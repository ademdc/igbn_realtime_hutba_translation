    faq:
      title: Česta pitanja
      items:
      - q: Na kojem jeziku imam treba govoriti?
        a: Bosanski, hrvatski, srpski, albanski, turski, arapski, urdu, njemački, engleski, francuski ili holandski. Jezik birate pri prijavi i možete ga promijeniti bilo kada.
      - q: Trebaju li slušaoci aplikaciju?
        a: Ne. Skeniraju QR kod i čitaju u pregledniku. Radi na svakom pametnom telefonu.
      - q: Šta nam treba u džamiji?
        a: Mobitel, tablet ili laptop s internetom u blizini imama. Mikrofon na kopču poboljšava kvalitet, ali nije obavezan.
      - q: Možemo li prevod prikazati na televizoru?
        a: Da. Otvorite vas-dzemat.hutba.app/tv na pametnom televizoru, preko Chromecasta ili na laptopu povezanom HDMI kablom. Slova su dovoljno velika za cijelu džamiju, a QR kod poziva da se prati i na mobitelu.
      - q: Koliko je prevod tačan?
        a: Prevod je vrlo razumljiv, ali je mašinski. Ajeti i ustaljeni izrazi se uglavnom tačno prepoznaju; pojedinačne greške su moguće.
      - q: Možemo li koristiti vlastitu domenu?
        a: Da, za 5 € mjesečno. Slušaoci tada otvaraju npr. hutba.vasa-dzamija.com umjesto vas-dzemat.hutba.app. Domenu zakupite pod Plaćanje, dodate CNAME zapis kod pružaoca domene, a mi se pobrinemo za sigurnosni certifikat.
      - q: Šta se dešava nakon 30 dana?
        a: 'Na vrijeme dobijete podsjetnik. Ako platite, sve radi dalje. Ako ne platite, džemat prelazi na besplatni paket: 60 minuta prenosa mjesečno na jednom jeziku.'
