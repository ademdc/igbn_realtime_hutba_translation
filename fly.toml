# Fly.io configuration. See SETUP.md ("Production on Fly.io") for the one-time setup.
# Rename `app` if you create a new Fly app for hutba.app.

app = 'igbn-realtime-hutba-translation'
primary_region = 'fra'
console_command = '/rails/bin/rails console'

[build]

[deploy]
  release_command = './bin/rails db:migrate'

[processes]
  app = './bin/rails server'
  # Own-domain certificate checks and billing reminders (Heroku Scheduler's job on Heroku)
  scheduler = './bin/scheduler'

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine running: Soniox connections live in its memory, and a cold
  # start would delay the imam's first words on Friday. Don't scale `app` above 1.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/up'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['scheduler']

[[statics]]
  guest_path = '/rails/public'
  url_prefix = '/'
